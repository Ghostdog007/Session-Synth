[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-to-text-pipeline"
version = "0.1.0"
description = "Chunked video-to-text pipeline scaffold with Hugging Face integration points"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
hf = [
  "transformers>=4.48.0",
  "accelerate",
  "torch",
  "huggingface_hub",
  "qwen-vl-utils>=0.0.8",
  "decord",
  "pyannote.audio",
]
video = [
  "opencv-python",
  "ffmpeg-python",
]

[project.scripts]
video-to-text = "video_to_text.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
